name: Build & Release

on:
  push:
    tags:
      - 'v*'  # запускается при пуше тега v0.5.1, v0.6.0 и т.д.

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ffmpeg = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName -Destination ffmpeg.exe
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_tmp
          Write-Host "ffmpeg.exe downloaded: $((Get-Item ffmpeg.exe).Length / 1MB) MB"

      - name: Build exe
        run: pyinstaller YouTubeDownloader.spec

      - name: Prepare zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force
          Copy-Item dist\YouTubeDownloader.exe release\
          Copy-Item CHANGELOG.md release\
          Copy-Item README.md release\
          Copy-Item requirements.txt release\
          Compress-Archive -Path release\* -DestinationPath YouTubeDownloader.zip -Force

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: YouTubeDownloader.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}